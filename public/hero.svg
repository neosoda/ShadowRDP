<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="388" viewBox="0 0 1200 388" role="img" aria-labelledby="title desc">
<title id="title">ShadowRDP — Remote support, made simpler</title>
<desc id="desc">Modern dark blue banner with networked desktop icons and a central support console</desc>
<defs>
  <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#070C19"/><stop offset=".55" stop-color="#10233D"/><stop offset="1" stop-color="#081520"/></linearGradient>
